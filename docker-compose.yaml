services:
  nginx:
    image:          "nginx:stable-alpine"
    container_name: nginx_laravel_app
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/laravel
      - ./docker/configs/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./var/logs/nginx:/var/log/nginx
    links:
      - php

  php:
    container_name: php_laravel_app
    build:
      context:    ./
      dockerfile: docker/configs/php/Dockerfile
    environment:
      XDEBUG_CONFIG:  remote_host={{YOUR_IP_ADDRESS}}
      PHP_IDE_CONFIG: serverName=docker
    volumes:
      - ./src:/var/www/laravel
    links:
      - mysql

  mysql:
    image:          mysql:latest
    container_name: mysql_laravel_app
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-laravel_db}
      MYSQL_USER:          ${MYSQL_USER:-dbuser}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-pass4dbuser}
    volumes:
      - ./docker/databases/mysql_dump:/docker-entrypoint-initdb.d